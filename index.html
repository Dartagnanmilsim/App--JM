<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aprender Jugando</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <span>🎈</span><span>⭐</span><span>☁️</span><span>🌈</span><span>🎈</span><span>⭐</span><span>☁️</span>
</div>

<header>
  <div class="mascot" id="mascot" role="button" tabindex="0" aria-label="Hola">👶</div>
  <h1>Aprender Jugando</h1>
  <p class="sub">Toca un juego para empezar</p>
</header>

<main class="menu">

  <a class="module colores" href="color-game.html" data-say="¡Colores!" data-game="colores">
    <div class="icon">🎨</div>
    <div class="info">
      <h2>Colores</h2>
      <div class="preview">
        <i style="background:#e63946"></i><i style="background:#1e6fd9"></i>
        <i style="background:#ffd60a"></i><i style="background:#2a9d3f"></i>
      </div>
      <div class="meta"><span class="go">▶ Jugar</span><span class="stars" data-stars></span></div>
    </div>
  </a>

  <a class="module animales" href="animals.html" data-say="¡Animales!" data-game="animales">
    <div class="icon">🐶</div>
    <div class="info">
      <h2>Animales</h2>
      <div class="preview emojis"><b>🐱</b><b>🐮</b><b>🐷</b><b>🦁</b></div>
      <div class="meta"><span class="go">▶ Jugar</span><span class="stars" data-stars></span></div>
    </div>
  </a>

  <a class="module figuras" href="shapes.html" data-say="¡Figuras!" data-game="figuras">
    <div class="icon">
      <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 94,90 6,90" fill="#e63946"/></svg>
    </div>
    <div class="info">
      <h2>Figuras</h2>
      <div class="preview shapes">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#1e6fd9"/></svg>
        <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="10" y="10" width="80" height="80" rx="4" fill="#2a9d3f"/></svg>
        <svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,5 61,38 96,38 68,59 78,93 50,72 22,93 32,59 4,38 39,38" fill="#ffb703"/></svg>
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 90 C 20 68, 4 50, 4 31 C 4 16, 16 6, 29 6 C 39 6, 46 12, 50 20 C 54 12, 61 6, 71 6 C 84 6, 96 16, 96 31 C 96 50, 80 68, 50 90 Z" fill="#ff5d8f"/></svg>
      </div>
      <div class="meta"><span class="go">▶ Jugar</span><span class="stars" data-stars></span></div>
    </div>
  </a>

</main>

<script>
  // Voz del dispositivo para decir el nombre del juego al tocarlo
  function sayName(text) {
    if (!("speechSynthesis" in window)) return;
    try {
      var synth = window.speechSynthesis;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var es = synth.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
      if (es.length) { u.voice = es[0]; u.lang = es[0].lang; } else { u.lang = "es-ES"; }
      u.rate = 0.9; u.pitch = 1.15;
      synth.speak(u);
    } catch (e) {}
  }

  // Al tocar un módulo: rebota, dice su nombre y entra al juego
  document.querySelectorAll(".module").forEach(function (card) {
    card.addEventListener("click", function (ev) {
      ev.preventDefault();
      if (card.classList.contains("tapped")) return;
      card.classList.add("tapped");
      sayName(card.dataset.say);
      setTimeout(function () { window.location.href = card.getAttribute("href"); }, 900);
    });
  });

  // Al volver con el botón "atrás", quitar el estado de tocado
  window.addEventListener("pageshow", function () {
    document.querySelectorAll(".module.tapped").forEach(function (c) { c.classList.remove("tapped"); });
  });

  // La mascota saluda
  var mascot = document.getElementById("mascot");
  function wave() {
    mascot.classList.remove("hello"); void mascot.offsetWidth; mascot.classList.add("hello");
    sayName("¡Hola! ¿A qué jugamos?");
  }
  mascot.addEventListener("click", wave);
  mascot.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); wave(); } });

  // Estrellas ganadas en cada juego
  document.querySelectorAll(".module").forEach(function (card) {
    var n = 0;
    try { n = parseInt(localStorage.getItem("stars_" + card.dataset.game), 10) || 0; } catch (e) {}
    if (n > 0) card.querySelector("[data-stars]").textContent = "⭐ " + n;
  });
</script>

</body>
</html>
