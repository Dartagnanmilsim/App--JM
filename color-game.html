<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¿Dónde está el color?</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
    }
    .top a, .top button {
      width: auto;
      margin: 0;
      padding: 12px 18px;
      font-size: 28px;
      border-radius: 50px;
      background: #8bd3dd;
      color: white;
      text-decoration: none;
      border: none;
    }
    .stars { font-size: 26px; min-height: 34px; }

    #question { font-size: 34px; margin: 8px 16px 0; min-height: 44px; }

    #board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 28px;
      padding: 24px 16px;
    }
    .ball {
      width: 38vmin;
      height: 38vmin;
      max-width: 220px;
      max-height: 220px;
      border-radius: 50%;
      border: 6px solid #d9cfc1;
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s, opacity 0.3s;
    }
    .ball:active { transform: scale(0.92); }
    .ball.wiggle { animation: wiggle 0.5s; }
    .ball.win { animation: grow 0.8s forwards; }
    .ball.fade { opacity: 0.25; }

    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px); }
      40% { transform: translateX(14px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }
    @keyframes grow {
      50% { transform: scale(1.25) rotate(10deg); }
      100% { transform: scale(1.15); }
    }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      align-items: center;
      overflow-y: auto;
      padding: 16px 0;
      box-sizing: border-box;
      background: #fef6e4;
      z-index: 10;
    }
    #start button { width: auto; padding: 24px 56px; font-size: 40px; }
    #start .big { font-size: 70px; }
    #start .tip { font-size: 18px; color: #6b6470; margin-top: 18px; padding: 0 16px; }
    #start h1 { margin: 0 0 12px; }

    .confetti {
      position: fixed;
      top: -60px;
      font-size: 44px;
      pointer-events: none;
      animation: fall 1.8s linear forwards;
      z-index: 5;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>

<div id="start">
  <div class="big">🎨</div>
  <h1>¿Dónde está el color?</h1>
  <button id="play">▶️ Jugar</button>
  <p class="tip" id="tip">🔈 Sube el volumen. En iPhone, ábrelo en Safari para oír la voz del teléfono.</p>
</div>

<div class="top">
  <a href="index.html" aria-label="Inicio">🏠</a>
  <div class="stars" id="stars"></div>
  <button id="repeat" aria-label="Repetir">🔊</button>
</div>

<h2 id="question"></h2>
<div id="board"></div>

<script src="voice.js"></script>
<script>
  // Colores con nombre en español (artículo incluido para la pregunta)
  const COLORS = [
    { name: "rojo", key: "rojo",     hex: "#e63946" },
    { name: "azul", key: "azul",     hex: "#1e6fd9" },
    { name: "amarillo", key: "amarillo", hex: "#ffd60a" },
    { name: "verde", key: "verde",    hex: "#2a9d3f" },
    { name: "naranja", key: "naranja",  hex: "#ff8c1a" },
    { name: "morado", key: "morado",   hex: "#8e44ad" },
    { name: "rosa", key: "rosa",     hex: "#ff7eb6" },
    { name: "negro", key: "negro",    hex: "#222222" },
    { name: "blanco", key: "blanco",   hex: "#ffffff" },
    { name: "marrón",   key: "marron",   hex: "#8b5a2b" },
  ];
  // ---- Voz ----
  // 1) Voz del propio dispositivo (en iPhone/iPad: la voz en español del sistema,
  //    la más parecida a Siri que Safari permite usar).
  // 2) Si el dispositivo no habla (algunas apps o navegadores no lo permiten),
  //    se reproducen audios grabados de reserva que están en audio/amigo/.
  const player = new Audio();
  player.preload = "auto";
  let queue = [];
  let queueId = 0;
  let deviceVoice = null;
  let deviceWorks = null; // null = aún no se sabe, true / false después del primer intento

  function pickDeviceVoice() {
    if (!("speechSynthesis" in window)) return;
    const es = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
    const score = v => {
      const n = (v.name + " " + v.voiceURI).toLowerCase();
      let s = 0;
      if (n.includes("siri")) s += 100;
      if (n.includes("premium")) s += 60;
      if (n.includes("enhanced") || n.includes("mejorad")) s += 50;
      if (/m[oó]nica|paulina|marisol|isabela|helena/.test(n)) s += 20;
      if (/^es[-_](es|mx)/i.test(v.lang)) s += 10;
      if (v.localService) s += 5;
      if (/eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bells|bubbles|jester|organ|trinoids|whisper|zarvox|superstar|bahh|boing|cellos|wobble|bad news|good news|junior|ralph|fred|kathy/.test(n)) s -= 80;
      return s;
    };
    es.sort((a, b) => score(b) - score(a));
    deviceVoice = es[0] || null;
  }
  if ("speechSynthesis" in window) {
    pickDeviceVoice();
    speechSynthesis.onvoiceschanged = pickDeviceVoice;
  }

  function clipSrc(key) {
    const embedded = window.AUDIO_DATA && window.AUDIO_DATA.amigo && window.AUDIO_DATA.amigo[key];
    return embedded || ("audio/amigo/" + key + ".mp3");
  }

  function playClips(keys, id) {
    queue = keys.slice();
    const next = () => {
      if (id !== queueId || !queue.length) return;
      player.muted = false;
      player.src = clipSrc(queue.shift());
      const p = player.play();
      if (p && p.catch) p.catch(() => {});
    };
    player.onended = next;
    next();
  }

  // Dice el texto con la voz del dispositivo; si no empieza a sonar, usa los audios grabados.
  function say(keys, text) {
    const id = ++queueId;
    if (!player.muted) player.pause();
    queue = [];
    const canSpeak = "speechSynthesis" in window && deviceWorks !== false;
    if (!canSpeak) { playClips(keys, id); return; }

    const synth = window.speechSynthesis;
    if (synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (deviceVoice) { u.voice = deviceVoice; u.lang = deviceVoice.lang; } else { u.lang = "es-ES"; }
    u.rate = 0.85;   // un poco lento para niños pequeños
    u.pitch = 1.15;  // tono alegre
    u.volume = 1;
    let started = false;
    u.onstart = () => { started = true; deviceWorks = true; };
    u.onerror = e => {
      if (e.error === "interrupted" || e.error === "canceled") return;
      if (!started && id === queueId) { deviceWorks = false; playClips(keys, id); }
    };
    synth.resume();
    synth.speak(u);
    if (deviceWorks !== true) {
      setTimeout(() => {
        if (!started && id === queueId) { deviceWorks = false; synth.cancel(); playClips(keys, id); }
      }, 1500);
    }
  }

  const PRAISE = ["¡Muy bien!", "¡Bravo!", "¡Excelente!", "¡Sí, lo encontraste!", "¡Genial!"];
  const PARTY = ["🎈", "⭐", "🎉", "🌈", "💖", "✨"];

  const board = document.getElementById("board");
  const question = document.getElementById("question");
  const starsEl = document.getElementById("stars");

  let target = null;
  let lastTarget = null;
  let wins = 0;
  let busy = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Siempre 4 colores diferentes en pantalla
  const OPTIONS = 4;

  function ask() {
    const msg = "¿Dónde está el " + target.name + "?";
    question.textContent = msg;
    question.style.color = target.hex;
    say(["q_" + target.key], msg);
  }

  function newRound() {
    busy = false;
    const pool = COLORS.filter(c => c !== lastTarget);
    target = pool[Math.floor(Math.random() * pool.length)];
    lastTarget = target;

    const others = shuffle(COLORS.filter(c => c !== target)).slice(0, OPTIONS - 1);
    const options = shuffle([target, ...others]);

    board.innerHTML = "";
    options.forEach(color => {
      const ball = document.createElement("div");
      ball.className = "ball";
      ball.style.background = color.hex;
      ball.setAttribute("role", "button");
      ball.setAttribute("aria-label", color.name);
      ball.addEventListener("click", () => choose(color, ball));
      board.appendChild(ball);
    });
    ask();
  }

  function choose(color, ball) {
    if (busy) return;

    if (color === target) {
      busy = true;
      wins++;
      starsEl.textContent = "⭐".repeat(wins % 10 || 10);
      ball.classList.add("win");
      [...board.children].forEach(b => { if (b !== ball) b.classList.add("fade"); });
      const praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      question.textContent = praise;
      const pi = PRAISE.indexOf(praise);
      say(["p_" + pi, "c_" + color.key], praise + " ¡" + capitalize(color.name) + "!");
      celebrate();
      setTimeout(newRound, 2800);
    } else {
      // Error amable: decir qué color tocó y repetir la pregunta
      ball.classList.remove("wiggle");
      void ball.offsetWidth; // reinicia la animación
      ball.classList.add("wiggle");
      say(["ese_" + color.key, "q_" + target.key],
          "Ese es " + color.name + ". ¿Dónde está el " + target.name + "?");
    }
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function celebrate() {
    for (let i = 0; i < 14; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = PARTY[Math.floor(Math.random() * PARTY.length)];
      c.style.left = Math.random() * 95 + "vw";
      c.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2600);
    }
  }

  document.getElementById("repeat").addEventListener("click", () => { if (target) ask(); });

  // El primer toque es necesario para que el navegador permita la voz
  document.getElementById("play").addEventListener("click", () => {
    // Desbloquea el audio de reserva dentro del toque (necesario en iPhone)
    player.src = clipSrc("hola");
    player.muted = true;
    const p = player.play();
    if (p && p.then) p.then(() => { if (player.muted) { player.pause(); player.muted = false; } }).catch(() => { player.muted = false; });
    else player.muted = false;
    document.getElementById("start").remove();
    newRound();
  });
</script>
</body>
</html>
